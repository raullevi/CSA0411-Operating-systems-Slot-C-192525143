version: '3.8'

services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: simats/result-portal:1.0
    container_name: result_portal_app
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    depends_on:
      - portal-db

  portal-db:
    image: postgres:15-alpine
    container_name: result_portal_db
    environment:
      POSTGRES_DB: result_db
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: secretpassword
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
